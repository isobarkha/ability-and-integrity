<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDIS Daily Shift Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@400;500;600;700;800&display=swap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

tailwind.config = {

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: #f1f4f8; }
  input[type="date"]::-webkit-calendar-picker-indicator { cursor:pointer; opacity:0.4; }
  input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity:0.7; }
  .tbl-scroll::-webkit-scrollbar { height:5px; }
  .tbl-scroll::-webkit-scrollbar-track { background:#edf0f4; border-radius:3px; }
  .tbl-scroll::-webkit-scrollbar-thumb { background:#c4cdd8; border-radius:3px; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation: fadeIn 0.3s ease-out both; }
  @keyframes toastSlide { from{opacity:0;transform:translate(-50%,12px) scale(0.96)} to{opacity:1;transform:translate(-50%,0) scale(1)} }
  @media (max-width: 640px) {
    .tbl-scroll { -webkit-overflow-scrolling: touch; }
    header h1 { font-size: 13px !important; }
    header p { font-size: 10px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const APP_PASSWORD = '2567';

function LoginGate({ onAuth }) {
  const [pw, setPw] = useState('');
  const [error, setError] = useState(false);
  const [show, setShow] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { inputRef.current && inputRef.current.focus(); }, []);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (pw === APP_PASSWORD) {
      try { sessionStorage.setItem('ndis-auth','1'); } catch(e) {}
      onAuth();
    } else {
      setError(true);
      setPw('');
      setTimeout(() => setError(false), 2000);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{background:'linear-gradient(135deg,#1e293b 0%,#0f172a 100%)'}}>
      <div className="w-full max-w-[380px]">
        <div className="text-center mb-8">
          <div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
            <svg className="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          </div>
          <h1 className="font-display text-xl font-bold text-white mb-1">Daily Shift Notes</h1>
          <p className="text-sm text-slate-400">Ability & Integrity Services PTY LTD</p>
        </div>
        <form onSubmit={handleSubmit} className="bg-white/[0.06] backdrop-blur border border-white/10 rounded-xl p-6">
          <label className="block text-[11px] font-semibold text-slate-400 mb-2 tracking-widest">PASSWORD</label>
          <div className="relative mb-4">
            <input ref={inputRef} type={show ? 'text' : 'password'} value={pw} onChange={e=>setPw(e.target.value)}
              placeholder="Enter access password"
              className={`w-full h-11 px-4 pr-11 rounded-lg bg-white/10 border text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 transition ${error ? 'border-red-500 focus:ring-red-500/30 shake' : 'border-white/10 focus:border-blue-500 focus:ring-blue-500/30'}`} />
            <button type="button" onClick={()=>setShow(!show)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition">
              {show ? (
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
              ) : (
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              )}
            </button>
          </div>
          {error && <p className="text-red-400 text-[12px] mb-3 font-medium">Incorrect password. Try again.</p>}
          <button type="submit"
            className="w-full h-11 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold shadow-lg shadow-blue-600/30 transition">
            Access App
          </button>
        </form>
        <p className="text-center text-[10px] text-slate-600 mt-6">Confidential &middot; Authorised personnel only</p>
      </div>
    </div>
  );
}

const ACTIVITIES = [
  "Waking, Settling & Morning Presentation",
  "Personal Care, Hygiene & Continence Care",
  "Dressing, Grooming & Getting Ready",
  "Mobility, Transfers, Positioning & Walking",
  "Meals, Hydration & Feeding",
  "Daily Activities, Community & Participation",
  "Rest, Sleep, Fatigue & Comfort Support",
  "Communication, Choice & Emotional Wellbeing"
];
const SHIFT_KEYS = ['morning','afternoon','night'];
const SHIFT_LABELS = ['Morning Shift','Afternoon Shift','Active Night Shift'];

const DEFAULT_PROFILES = [
  { id:'p1', name:'Islah Ashiana Ali', ndis:'430225065', location:'80 Foley Cct Harrington Park 2567', worker1:'Nur Khan', worker2:'Mary Sacay' },
  { id:'p2', name:'Alesha Ali', ndis:'430181523', location:'80 Foley Cct Harrington Park 2567', worker1:'Nur Khan', worker2:'Mary Sacay' },
];

function loadProfiles() {
  try {
    const s = localStorage.getItem('ndis-profiles');
    if (s) { const p = JSON.parse(s); if (Array.isArray(p) && p.length) return p; }
  } catch(e) {}
  return DEFAULT_PROFILES;
}

function saveProfiles(profiles) {
  try { localStorage.setItem('ndis-profiles', JSON.stringify(profiles)); } catch(e) {}
}

const DEFAULT_MATRIX = {
  '0_morning':'Usual','1_morning':'Usual','2_morning':'Usual','3_morning':'Usual','4_morning':'Usual','5_morning':'Usual','6_morning':'N/A','7_morning':'Usual',
  '0_afternoon':'Usual','1_afternoon':'Usual','2_afternoon':'Usual','3_afternoon':'Usual','4_afternoon':'Usual','5_afternoon':'Usual','6_afternoon':'Usual','7_afternoon':'Usual',
  '0_night':'N/A','1_night':'Usual','2_night':'N/A','3_night':'Usual','4_night':'N/A','5_night':'N/A','6_night':'Usual','7_night':'N/A',
};

function initForm() {
  const td = new Date().toISOString().slice(0,10);
  return {
    participantName:'', ndisNumber:'', supportDate: td,
    serviceLocation:'', worker1:'', worker2:'',
    matrix: {...DEFAULT_MATRIX},
    obsMorning:'', obsAfternoon:'', obsNight:'',
    incident: false, incidentDetails:'',
    signoff: { morning:{name:'',sig:'',date:td}, afternoon:{name:'',sig:'',date:td}, night:{name:'',sig:'',date:td} }
  };
}

/* ── PDF ── */
function generatePDF(form) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','mm','a4');
  const W = 210, H = 297, ML = 14, MR = 14, CW = W - ML - MR;
  let y = 14;
  const navy=[23,42,69], blue=[37,99,235], lightBg=[241,244,248], white=[255,255,255], mid=[100,116,139], borderC=[210,218,228], green=[5,150,105], amber=[217,119,6], slateGr=[100,116,139];

  function addFooters() {
    const pc = doc.internal.getNumberOfPages();
    for (let i=1;i<=pc;i++) {
      doc.setPage(i);
      doc.setDrawColor(...borderC); doc.setLineWidth(0.3);
      doc.line(ML, H-12, W-MR, H-12);
      doc.setFontSize(7); doc.setTextColor(...mid);
      doc.text('Ability & Integrity Services PTY LTD  |  NDIS Daily Shift Notes & Care Record  |  Confidential', W/2, H-8, {align:'center'});
      doc.text(`Page ${i} of ${pc}`, W-MR, H-8, {align:'right'});
    }
  }
  function sectionBar(num, title) {
    checkPage(12);
    doc.setFillColor(...navy);
    doc.roundedRect(ML, y, CW, 8, 1, 1, 'F');
    doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(255,255,255);
    doc.text(`${num}.  ${title}`, ML+5, y+5.5);
    y += 12;
  }
  function checkPage(need) { if (y+need > H-18) { doc.addPage(); y=14; } }
  function drawCheckbox(x, cy, checked, color) {
    const s=3, bx=x, by=cy-s/2;
    if (checked) {
      doc.setFillColor(...color); doc.roundedRect(bx,by,s,s,0.5,0.5,'F');
      doc.setDrawColor(255,255,255); doc.setLineWidth(0.4);
      doc.line(bx+0.6,by+1.6,bx+1.2,by+2.2); doc.line(bx+1.2,by+2.2,bx+2.3,by+0.9);
    } else {
      doc.setDrawColor(...borderC); doc.setLineWidth(0.3); doc.roundedRect(bx,by,s,s,0.5,0.5,'S');
    }
  }

  doc.setFillColor(...blue); doc.rect(0,0,W,3,'F');
  y=10;
  doc.setFontSize(18); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
  doc.text('NDIS DAILY SHIFT NOTES', W/2, y, {align:'center'});
  y+=7; doc.setFontSize(13); doc.setTextColor(...blue);
  doc.text('& CARE RECORD', W/2, y, {align:'center'});
  y+=5; doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...mid);
  doc.text('Ability & Integrity Services PTY LTD', W/2, y, {align:'center'});
  y+=4; doc.setDrawColor(...blue); doc.setLineWidth(0.6); doc.line(ML,y,W-MR,y); y+=6;

  sectionBar('1','PARTICIPANT & SHIFT DETAILS');
  const s1 = [[{l:'Participant Name / Preferred',v:form.participantName},{l:'NDIS Number',v:form.ndisNumber}],[{l:'Date of Support',v:form.supportDate},{l:'Service Location / Home',v:form.serviceLocation}],[{l:'Primary Support Worker 1',v:form.worker1},{l:'Primary Support Worker 2',v:form.worker2}]];
  doc.autoTable({ startY:y, margin:{left:ML,right:MR}, body:s1.map(r=>[r[0].l,r[0].v||'',r[1].l,r[1].v||'']),
    columnStyles:{0:{cellWidth:CW*0.22,fillColor:lightBg,fontStyle:'bold',textColor:navy,fontSize:8},1:{cellWidth:CW*0.28,fontSize:9},2:{cellWidth:CW*0.22,fillColor:lightBg,fontStyle:'bold',textColor:navy,fontSize:8},3:{cellWidth:CW*0.28,fontSize:9}},
    styles:{cellPadding:3,lineColor:borderC,lineWidth:0.3,font:'helvetica'}, theme:'grid' });
  y = doc.lastAutoTable.finalY + 6;

  sectionBar('2','DAILY ROUTINE SUPPORT MATRIX');
  doc.setFontSize(7); doc.setFont('helvetica','italic'); doc.setTextColor(...mid);
  doc.text("Check 'Usual' if the care routine was completed as expected. 'Diff' if varied. 'N/A' if not applicable.", ML+2, y); y+=5;
  const mHead=[['Care Activity / Routine Area','Morning Shift\n(Time & Initials)','Afternoon Shift\n(Time & Initials)','Active Night Shift\n(Time & Initials)']];
  const mBody=ACTIVITIES.map((a,i)=>{const c=[a];['morning','afternoon','night'].forEach(sh=>{ c.push(''); }); return c;});
  doc.autoTable({ startY:y, margin:{left:ML,right:MR}, head:mHead, body:mBody,
    headStyles:{fillColor:blue,textColor:white,fontSize:8,fontStyle:'bold',halign:'center',cellPadding:3.5},
    columnStyles:{0:{cellWidth:CW*0.34,fontStyle:'bold',textColor:navy,fontSize:8,halign:'left'},1:{cellWidth:CW*0.22,fontSize:7,halign:'center',minCellHeight:10},2:{cellWidth:CW*0.22,fontSize:7,halign:'center',minCellHeight:10},3:{cellWidth:CW*0.22,fontSize:7,halign:'center',minCellHeight:10}},
    styles:{cellPadding:3,lineColor:borderC,lineWidth:0.3,font:'helvetica'}, alternateRowStyles:{fillColor:[248,250,252]}, theme:'grid',
    didDrawCell:(data)=>{if(data.section==='body'&&data.column.index>0){const ai=data.row.index,sk=['morning','afternoon','night'][data.column.index-1],sel=form.matrix[`${ai}_${sk}`]||'',cx=data.cell.x,cy=data.cell.y+data.cell.height/2,sp=data.cell.width/3;
      doc.setFontSize(7);doc.setFont('helvetica','normal');
      [[0,'Usual',green],[1,'Diff',amber],[2,'N/A',slateGr]].forEach(([idx,label,color])=>{const bx=cx+3+idx*sp;const ch=sel===label;drawCheckbox(bx,cy,ch,color);doc.setTextColor(...(ch?color:mid));doc.text(label,bx+4,cy+1);});
      doc.setTextColor(0,0,0);}} });
  y = doc.lastAutoTable.finalY + 6;

  sectionBar('3','UNUSUAL EVENTS OR HANDOVER NOTES');
  doc.setFontSize(7); doc.setFont('helvetica','italic'); doc.setTextColor(...mid);
  doc.text('Record anything unusual, unexpected, or differing from the established routine.', ML+2, y); y+=5;
  [{l:'Morning Shift Observations\n(Time / Details / Participant Response)',t:form.obsMorning},{l:'Afternoon Shift Observations\n(Time / Details / Participant Response)',t:form.obsAfternoon},{l:'Active Night Shift Observations\n(Time / Sleep Patterns / Support Provided)',t:form.obsNight}].forEach(o=>{
    checkPage(40);
    doc.autoTable({startY:y,margin:{left:ML,right:MR},body:[[o.l,o.t||'\n\n\n\n\n']],
      columnStyles:{0:{cellWidth:CW*0.32,fillColor:lightBg,fontStyle:'bold',textColor:navy,fontSize:8,cellPadding:4},1:{cellWidth:CW*0.68,fontSize:9,minCellHeight:28,cellPadding:4}},
      styles:{lineColor:borderC,lineWidth:0.3,font:'helvetica',overflow:'linebreak'},theme:'grid'});
    y=doc.lastAutoTable.finalY+2;}); y+=4;

  sectionBar('4','SAFETY, INCIDENTS & SHIFT HANDOVER');
  doc.autoTable({startY:y,margin:{left:ML,right:MR},
    body:[['Incident / Hazard / Concern?',form.incident?'Yes':'No'],['Details\n(Record reference, person notified\n& immediate action taken)',form.incidentDetails||'\n\n\n\n']],
    columnStyles:{0:{cellWidth:CW*0.32,fillColor:lightBg,fontStyle:'bold',textColor:navy,fontSize:8,cellPadding:4},1:{cellWidth:CW*0.68,fontSize:9,minCellHeight:20,cellPadding:4}},
    styles:{lineColor:borderC,lineWidth:0.3,font:'helvetica',overflow:'linebreak'},theme:'grid'});
  y=doc.lastAutoTable.finalY+6;

  sectionBar('5','WORKER SIGN-OFF & COMPLIANCE DECLARATION');
  doc.setFontSize(7); doc.setFont('helvetica','italic'); doc.setTextColor(...mid);
  doc.text("By signing below, workers confirm support aligns with the participant's NDIS Support Plan and standards of Ability & Integrity Services PTY LTD.", ML+2, y, {maxWidth:CW-4}); y+=8;
  doc.autoTable({startY:y,margin:{left:ML,right:MR},
    head:[['Shift','Worker Names','Signature','Date']],
    body:[['Morning Shift',form.signoff.morning.name,form.signoff.morning.sig||'',form.signoff.morning.date],['Afternoon Shift',form.signoff.afternoon.name,form.signoff.afternoon.sig||'',form.signoff.afternoon.date],['Active Night Shift',form.signoff.night.name,form.signoff.night.sig||'',form.signoff.night.date]],
    headStyles:{fillColor:blue,textColor:white,fontSize:8,fontStyle:'bold',cellPadding:3.5},
    columnStyles:{0:{cellWidth:CW*0.22,fontStyle:'bold',textColor:navy,fontSize:8},1:{cellWidth:CW*0.28,fontSize:9,minCellHeight:16},2:{cellWidth:CW*0.28,fontSize:9,minCellHeight:16},3:{cellWidth:CW*0.22,fontSize:9}},
    styles:{cellPadding:3,lineColor:borderC,lineWidth:0.3,font:'helvetica'}, alternateRowStyles:{fillColor:[248,250,252]}, theme:'grid'});
  y=doc.lastAutoTable.finalY+6;

  checkPage(20);
  doc.setFillColor(...lightBg); doc.roundedRect(ML,y,CW,16,1,1,'F');
  doc.setFillColor(...blue); doc.rect(ML,y,1.5,16,'F');
  doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
  doc.text('Documentation Reminders:', ML+5, y+4.5);
  doc.setFont('helvetica','italic'); doc.setTextColor(...mid); doc.setFontSize(6.5);
  doc.text("Describe what you did, what you observed, and the participant's response. Do not copy forward routine text without verifying accuracy. 'Usual' does not replace recording mandatory chart details (e.g. actual intake, bowel records, medication, sleep, or clinical observations). Follow support plans, risk assessments, and agency procedures.", ML+5, y+8, {maxWidth:CW-10});
  addFooters();
  doc.save(`Shift_Notes_${(form.participantName||'Participant').replace(/\s+/g,'_')}_${form.supportDate||new Date().toISOString().slice(0,10)}.pdf`);
}

/* ── Components ── */

function SectionHeader({ num, title }) {
  return (
    <div className="flex items-center gap-3 px-5 py-3 bg-gradient-to-r from-[#17294a] to-[#1e3a5f]">
      <span className="flex items-center justify-center w-6 h-6 rounded-md bg-blue-600 text-white text-xs font-display font-bold">{num}</span>
      <h2 className="text-white text-[13px] font-display font-bold tracking-wide">{title}</h2>
    </div>
  );
}

function FormField({ label, children }) {
  return (
    <div>
      <label className="block text-[11px] font-semibold text-slate-500 mb-1 tracking-wide">{label}</label>
      {children}
    </div>
  );
}

function TextInput({ value, onChange, placeholder, type }) {
  return (
    <input type={type||'text'} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      className="w-full h-10 px-3 rounded-md border border-slate-300 bg-white text-[14px] text-slate-800 font-body placeholder:text-slate-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition" />
  );
}

function OptionPill({ label, selected, color, onClick }) {
  const styles = {
    Usual:  { active: 'bg-emerald-600 text-white border-emerald-600 shadow-sm shadow-emerald-200', idle: 'border-slate-200 text-slate-400 hover:border-emerald-300 hover:text-emerald-600 hover:bg-emerald-50' },
    Diff:   { active: 'bg-amber-500 text-white border-amber-500 shadow-sm shadow-amber-200', idle: 'border-slate-200 text-slate-400 hover:border-amber-300 hover:text-amber-600 hover:bg-amber-50' },
    'N/A':  { active: 'bg-slate-500 text-white border-slate-500 shadow-sm shadow-slate-200', idle: 'border-slate-200 text-slate-400 hover:border-slate-400 hover:text-slate-500 hover:bg-slate-50' },
  };
  const s = styles[label] || styles.Usual;
  return (
    <button onClick={onClick}
      className={`px-2.5 py-[5px] rounded text-[11px] font-semibold border transition-all duration-100 ${selected ? s.active : s.idle}`}>
      {label}
    </button>
  );
}

/* ── Participant Search Dropdown ── */
function ParticipantSearch({ profiles, onSelect, onSave, onDelete, currentName }) {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const filtered = profiles.filter(p =>
    p.name.toLowerCase().includes(query.toLowerCase()) ||
    p.ndis.includes(query) ||
    p.location.toLowerCase().includes(query.toLowerCase())
  );

  return (
    <div ref={ref} className="relative">
      <label className="block text-[11px] font-semibold text-blue-600 mb-1 tracking-wide flex items-center gap-1.5">
        <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        SELECT PARTICIPANT
      </label>
      <div className="relative">
        <input
          value={query}
          onChange={e => { setQuery(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          placeholder="Type to search by name, NDIS number, or location..."
          className="w-full h-10 pl-9 pr-3 rounded-md border border-blue-300 bg-blue-50/50 text-[14px] text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition"
        />
        <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      {open && (
        <div className="absolute z-30 mt-1 w-full bg-white rounded-lg border border-slate-200 shadow-lg max-h-[240px] overflow-y-auto">
          {filtered.length === 0 && (
            <div className="px-4 py-3 text-[13px] text-slate-400 italic">No participants found</div>
          )}
          {filtered.map(p => (
            <button key={p.id} onClick={() => { onSelect(p); setQuery(''); setOpen(false); }}
              className="w-full text-left px-4 py-3 hover:bg-blue-50 transition border-b border-slate-100 last:border-0 group">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-[14px] font-semibold text-slate-800">{p.name}</span>
                  <span className="text-[12px] text-slate-400 ml-2">— {p.location}</span>
                  <span className="text-[12px] text-blue-500 ml-2 font-mono">{p.ndis}</span>
                </div>
                <button onClick={(e) => { e.stopPropagation(); if(confirm(`Remove "${p.name}" from saved participants?`)) onDelete(p.id); }}
                  className="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-500 transition p-1" title="Remove">
                  <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </button>
          ))}
          {currentName && !profiles.some(p => p.name === currentName) && (
            <button onClick={() => { onSave(); setOpen(false); }}
              className="w-full text-left px-4 py-3 bg-emerald-50 hover:bg-emerald-100 transition text-[13px] text-emerald-700 font-semibold flex items-center gap-2">
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
              Save "{currentName}" as new participant
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ── App ── */
function App() {
  const [authed, setAuthed] = useState(() => {
    try { return sessionStorage.getItem('ndis-auth') === '1'; } catch(e) { return false; }
  });

  if (!authed) return React.createElement(LoginGate, { onAuth: () => setAuthed(true) });

  return React.createElement(ShiftNotesApp, null);
}

function ShiftNotesApp() {
  const [form, setForm] = useState(initForm);
  const [profiles, setProfiles] = useState(loadProfiles);
  const [generating, setGenerating] = useState(false);
  const [toast, setToast] = useState('');

  const u = (k,v) => setForm(p=>({...p,[k]:v}));
  const uM = (i,s,v) => setForm(p=>({...p,matrix:{...p.matrix,[`${i}_${s}`]:v}}));
  const uS = (sh,fld,val) => setForm(p=>({...p,signoff:{...p.signoff,[sh]:{...p.signoff[sh],[fld]:val}}}));

  const selectProfile = (p) => {
    const wn = [p.worker1, p.worker2].filter(Boolean).join(' & ');
    setForm(prev => ({
      ...prev, participantName: p.name, ndisNumber: p.ndis, serviceLocation: p.location, worker1: p.worker1||'', worker2: p.worker2||'',
      matrix: {...DEFAULT_MATRIX},
      signoff: { morning:{...prev.signoff.morning, name:wn}, afternoon:{...prev.signoff.afternoon, name:wn}, night:{...prev.signoff.night, name:wn} }
    }));
  };
  const saveProfile = () => {
    if (!form.participantName) return;
    const np = { id: 'p'+Date.now(), name:form.participantName, ndis:form.ndisNumber, location:form.serviceLocation, worker1:form.worker1, worker2:form.worker2 };
    const updated = [...profiles, np];
    setProfiles(updated);
    saveProfiles(updated);
    setToast(`Saved "${form.participantName}"`);
  };
  const deleteProfile = (id) => {
    const updated = profiles.filter(p => p.id !== id);
    setProfiles(updated);
    saveProfiles(updated);
  };

  const handleDownload = () => {
    setGenerating(true);
    setTimeout(()=>{ try{generatePDF(form);setToast('PDF downloaded')}catch(e){setToast('Error');console.error(e)} setGenerating(false); },80);
  };
  const handleClear = () => {
    if(!confirm('Clear all fields?')) return;
    setForm(initForm());
  };

  const fmtDate = form.supportDate ? new Date(form.supportDate+'T00:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : '';

  return (
    <React.Fragment>
      {/* Blue accent bar */}
      <div className="h-1 bg-blue-600" />

      {/* Header */}
      <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
        <div className="max-w-[880px] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3 flex-wrap">
          <div className="flex items-center gap-3">
            {/* Logo mark */}
            <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-600 to-blue-700 flex items-center justify-center flex-shrink-0">
              <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <div>
              <h1 className="font-display font-bold text-[15px] text-slate-800 leading-tight">Daily Shift Notes & Care Record</h1>
              <p className="text-[11px] text-slate-400 font-medium">{fmtDate || 'Select date'}</p>
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={handleClear}
              className="h-9 px-3.5 rounded-lg text-[12px] font-semibold text-slate-500 border border-slate-200 hover:bg-slate-50 hover:border-slate-300 transition">
              Clear
            </button>
            <button onClick={handleDownload} disabled={generating}
              className="h-9 px-4 rounded-lg text-[12px] font-bold bg-blue-600 text-white hover:bg-blue-700 shadow-sm shadow-blue-200 transition disabled:opacity-50 flex items-center gap-1.5">
              <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 18h16"/></svg>
              {generating ? 'Generating...' : 'Download PDF'}
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-[880px] mx-auto px-4 sm:px-6 py-5 space-y-4 pb-16">

        {/* ── Section 1: Participant Details ── */}
        <section className="fade-in bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm">
          <SectionHeader num="1" title="PARTICIPANT & SHIFT DETAILS" />
          <div className="p-5">
            {/* Participant search */}
            <div className="mb-5 pb-5 border-b border-slate-100">
              <ParticipantSearch profiles={profiles} onSelect={selectProfile} onSave={saveProfile} onDelete={deleteProfile} currentName={form.participantName} />
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-4">
            <FormField label="PARTICIPANT NAME / PREFERRED">
              <TextInput value={form.participantName} onChange={v=>u('participantName',v)} placeholder="Full name" />
            </FormField>
            <FormField label="NDIS NUMBER">
              <TextInput value={form.ndisNumber} onChange={v=>u('ndisNumber',v)} placeholder="e.g. 431 234 567" />
            </FormField>
            <FormField label="DATE OF SUPPORT">
              <TextInput value={form.supportDate} onChange={v=>u('supportDate',v)} type="date" />
            </FormField>
            <FormField label="SERVICE LOCATION / HOME">
              <TextInput value={form.serviceLocation} onChange={v=>u('serviceLocation',v)} placeholder="Address or home" />
            </FormField>
            <FormField label="PRIMARY SUPPORT WORKER 1">
              <TextInput value={form.worker1} onChange={v=>u('worker1',v)} placeholder="Name" />
            </FormField>
            <FormField label="PRIMARY SUPPORT WORKER 2">
              <TextInput value={form.worker2} onChange={v=>u('worker2',v)} placeholder="Name" />
            </FormField>
            </div>
          </div>
        </section>

        {/* ── Section 2: Matrix ── */}
        <section className="fade-in bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm" style={{animationDelay:'40ms'}}>
          <SectionHeader num="2" title="DAILY ROUTINE SUPPORT MATRIX" />
          <div className="px-5 pt-3 pb-1">
            <p className="text-[11px] text-slate-400 italic leading-relaxed">
              Select <strong className="text-emerald-600 not-italic">Usual</strong> if care was routine, <strong className="text-amber-500 not-italic">Diff</strong> if it varied, or <strong className="text-slate-500 not-italic">N/A</strong> if not applicable.
            </p>
          </div>
          <div className="px-5 pb-5 overflow-x-auto tbl-scroll">
            <table className="w-full min-w-[660px] border-collapse text-sm mt-2">
              <thead>
                <tr className="bg-blue-600">
                  <th className="text-left text-white text-[12px] font-display font-semibold py-3 px-3 border border-blue-500 w-[240px]">Care Activity / Routine Area</th>
                  {SHIFT_LABELS.map((s,i)=>(
                    <th key={i} className="text-center text-white py-2.5 px-2 border border-blue-500">
                      <div className="text-[12px] font-display font-semibold">{s}</div>
                      <div className="text-[10px] font-normal opacity-75 mt-0.5 italic">Time & Initials</div>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {ACTIVITIES.map((act,i)=>(
                  <tr key={i} className={i%2===0?'bg-white':'bg-slate-50'}>
                    <td className="py-3 px-3 text-[13px] font-semibold text-slate-700 leading-snug border border-slate-200">{act}</td>
                    {SHIFT_KEYS.map(sk=>(
                      <td key={sk} className="py-2.5 px-2 border border-slate-200">
                        <div className="flex gap-1 justify-center">
                          {['Usual','Diff','N/A'].map(opt=>(
                            <OptionPill key={opt} label={opt} selected={form.matrix[`${i}_${sk}`]===opt} onClick={()=>uM(i,sk,opt)} />
                          ))}
                        </div>
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>

        {/* ── Section 3: Observations ── */}
        <section className="fade-in bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm" style={{animationDelay:'80ms'}}>
          <SectionHeader num="3" title="UNUSUAL EVENTS OR HANDOVER NOTES" />
          <div className="p-5 space-y-4">
            <p className="text-[11px] text-slate-400 italic -mt-1">Record anything unusual, unexpected, or differing from the established routine.</p>
            {[
              {key:'obsMorning', label:'Morning Shift Observations', hint:'Time / Details / Participant Response...'},
              {key:'obsAfternoon', label:'Afternoon Shift Observations', hint:'Time / Details / Participant Response...'},
              {key:'obsNight', label:'Active Night Shift Observations', hint:'Time / Sleep Patterns / Support Provided...'},
            ].map(o=>(
              <div key={o.key}>
                <label className="block text-[11px] font-semibold text-slate-500 mb-1 tracking-wide">{o.label.toUpperCase()}</label>
                <textarea value={form[o.key]} onChange={e=>u(o.key,e.target.value)} placeholder={o.hint} rows="3"
                  className="w-full px-3 py-2.5 rounded-md border border-slate-300 bg-white text-[14px] text-slate-800 placeholder:text-slate-300 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 resize-y leading-relaxed transition" />
              </div>
            ))}
          </div>
        </section>

        {/* ── Section 4: Safety ── */}
        <section className="fade-in bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm" style={{animationDelay:'120ms'}}>
          <SectionHeader num="4" title="SAFETY, INCIDENTS & SHIFT HANDOVER" />
          <div className="p-5">
            <div className="flex items-center justify-between flex-wrap gap-3 mb-3">
              <span className="text-[13px] font-semibold text-slate-700">Incident / Hazard / Concern?</span>
              <div className="flex rounded-md border border-slate-200 overflow-hidden">
                <button onClick={()=>u('incident',false)}
                  className={`px-5 py-2 text-[12px] font-semibold transition ${!form.incident ? 'bg-emerald-600 text-white' : 'bg-white text-slate-400 hover:bg-slate-50'}`}>No</button>
                <button onClick={()=>u('incident',true)}
                  className={`px-5 py-2 text-[12px] font-semibold border-l border-slate-200 transition ${form.incident ? 'bg-red-600 text-white' : 'bg-white text-slate-400 hover:bg-slate-50'}`}>Yes</button>
              </div>
            </div>
            {form.incident && (
              <div className="fade-in mt-3">
                <label className="block text-[11px] font-semibold text-slate-500 mb-1 tracking-wide">DETAILS (RECORD REFERENCE, PERSON NOTIFIED & ACTION TAKEN)</label>
                <textarea value={form.incidentDetails} onChange={e=>u('incidentDetails',e.target.value)}
                  placeholder="Describe the incident..." rows="3"
                  className="w-full px-3 py-2.5 rounded-md border border-red-300 bg-red-50/40 text-[14px] text-slate-800 placeholder:text-slate-300 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500/30 resize-y leading-relaxed transition" />
              </div>
            )}
          </div>
        </section>

        {/* ── Section 5: Sign-Off ── */}
        <section className="fade-in bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm" style={{animationDelay:'160ms'}}>
          <SectionHeader num="5" title="WORKER SIGN-OFF & COMPLIANCE DECLARATION" />
          <div className="p-5">
            <p className="text-[11px] text-slate-400 italic mb-4">By signing below, workers confirm support aligns with the participant's NDIS Support Plan and standards of Ability & Integrity Services PTY LTD.</p>
            <div className="overflow-x-auto tbl-scroll">
              <table className="w-full min-w-[520px] border-collapse text-sm">
                <thead>
                  <tr className="bg-blue-600">
                    <th className="text-left text-white text-[12px] font-display font-semibold py-2.5 px-3 border border-blue-500 w-[140px]">Shift</th>
                    <th className="text-left text-white text-[12px] font-display font-semibold py-2.5 px-3 border border-blue-500">Worker Name</th>
                    <th className="text-left text-white text-[12px] font-display font-semibold py-2.5 px-3 border border-blue-500">Signature</th>
                    <th className="text-left text-white text-[12px] font-display font-semibold py-2.5 px-3 border border-blue-500 w-[130px]">Date</th>
                  </tr>
                </thead>
                <tbody>
                  {SHIFT_KEYS.map((sk,i)=>(
                    <tr key={sk} className={i%2===0?'bg-white':'bg-slate-50'}>
                      <td className="py-2.5 px-3 text-[13px] font-semibold text-slate-700 border border-slate-200">{SHIFT_LABELS[i]}</td>
                      <td className="py-1.5 px-2 border border-slate-200">
                        <input value={form.signoff[sk].name} onChange={e=>uS(sk,'name',e.target.value)} placeholder="Name"
                          className="w-full h-8 px-2 rounded border border-slate-200 text-[13px] focus:outline-none focus:border-blue-500 transition" />
                      </td>
                      <td className="py-1.5 px-2 border border-slate-200">
                        <input value={form.signoff[sk].sig} onChange={e=>uS(sk,'sig',e.target.value)} placeholder="Signature"
                          className="w-full h-8 px-2 rounded border border-slate-200 text-[13px] focus:outline-none focus:border-blue-500 transition" />
                      </td>
                      <td className="py-1.5 px-2 border border-slate-200">
                        <input type="date" value={form.signoff[sk].date} onChange={e=>uS(sk,'date',e.target.value)}
                          className="w-full h-8 px-2 rounded border border-slate-200 text-[13px] focus:outline-none focus:border-blue-500 transition" />
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </section>

        {/* Reminder */}
        <div className="fade-in rounded-lg border-l-[3px] border-blue-600 bg-blue-50/60 px-4 py-3.5" style={{animationDelay:'200ms'}}>
          <p className="text-[11px] text-slate-500 leading-relaxed">
            <strong className="text-slate-700">Documentation Reminders:</strong> Describe what you did, what you observed, and the participant's response.
            Do not copy forward routine text without verifying accuracy. 'Usual' does not replace recording mandatory chart details
            (e.g. actual intake, bowel records, medication, sleep, or clinical observations).
          </p>
        </div>

        <p className="text-center text-[11px] text-slate-400 pt-1 pb-2 font-medium">
          Ability & Integrity Services PTY LTD &middot; Confidential
        </p>
      </main>

      {/* Generating overlay */}
      {generating && (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center">
          <div className="bg-white rounded-xl p-7 shadow-2xl text-center">
            <div className="w-8 h-8 border-[3px] border-slate-200 border-t-blue-600 rounded-full animate-spin mx-auto" />
            <p className="mt-3 text-[13px] font-semibold text-slate-700">Generating PDF...</p>
          </div>
        </div>
      )}

      {/* Toast */}
      {toast && (
        <div className="fixed bottom-5 left-1/2 z-50" style={{animation:'toastSlide 0.25s ease-out', transform:'translateX(-50%)'}}>
          <div className="flex items-center gap-2 bg-slate-800 text-white px-4 py-2.5 rounded-lg shadow-xl text-[12px] font-medium">
            <svg className="w-4 h-4 text-emerald-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            {toast}
          </div>
          {setTimeout(()=>setToast(''), 2500) && null}
        </div>
      )}
    </React.Fragment>
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
